syntax = "proto3";

package wisp;
option go_package = "wisp/proto";

service EventBroker {
  rpc PublishEvent (EventRequest) returns (PublishResponse);
rpc SubscribeTopic (SubscribeRequest) returns (stream EventResponse);
}

message SubscribeRequest{
  string topic = 1;
}

message EventResponse {
  string event_id = 1;
  bytes payload = 2;
  int64 timestamp = 3;
}


message EventRequest {
  string topic = 1;
  bytes payload = 2;
}

message PublishResponse {
  bool success = 1;
}