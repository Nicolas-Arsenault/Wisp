syntax = "proto3";

package wisp;
option go_package = "wisp/proto";

service EventBroker {
  // DescribeTopic returns how many shards a topic has, creating the topic if
  // it doesn't exist yet, with num_shards shards if given. Producers call it
  // once to hash keys to shards.
  rpc DescribeTopic (DescribeTopicRequest) returns (TopicInfo);
  // Publish is a long-lived producer stream. Each request holds records of
  // the shard the producer chose; the broker answers every request with one
  // ack, in request order.
  rpc Publish (stream PublishRequest) returns (stream PublishAck);
  // Subscribe streams one shard from start_id (or from its end if latest is
  // set): first every stored record, then new records as they are written,
  // unless stop_at_end is set.
  rpc Subscribe (SubscribeRequest) returns (stream EventBatch);
  // Join registers a consumer in a group of a topic for as long as the stream
  // is open. The broker splits the topic's shards between the group's
  // consumers and sends a new Assignment each time a consumer joins or leaves.
  rpc Join (JoinRequest) returns (stream Assignment);
  // Commit stores where a group has read a shard up to. Only the shard's
  // current owner can commit: any other caller gets FAILED_PRECONDITION.
  rpc Commit (CommitRequest) returns (CommitResponse);
}

message DescribeTopicRequest {
  string topic = 1;
  // num_shards is the shard count if this call creates the topic: 0 means the
  // default. It's ignored for an existing topic, whose count never changes:
  // read it from TopicInfo.
  int32 num_shards = 2;
}

message TopicInfo {
  string topic = 1;
  int32 num_shards = 2;
}

message PublishRequest {
  // request_id is chosen by the producer and echoed in the ack.
  uint64 request_id = 1;
  string topic = 2;
  // shard is hash(partition key) % num_shards, computed by the producer.
  int32 shard = 3;
  // payloads are stored together, as one unit: all of them or none. Each
  // must be a JSON object, and is stored as-is.
  repeated bytes payloads = 4;
  // producer_id and first_sequence let the broker drop retried records.
  // Sequences count a producer's records on one shard: 1, 2, 3, ...
  // first_sequence is that of payloads[0]; the others follow it. A
  // producer_id of 0 turns this off. A shard only remembers its most recent
  // producers, and accepts any first sequence from others. See PublishAck for
  // the error codes.
  uint64 producer_id = 5;
  uint64 first_sequence = 6;
}

message PublishAck {
  uint64 request_id = 1;
  int32 shard = 2;
  // first_event_id is the position in its shard (0, 1, 2, ...) of the first
  // record stored; the others follow it. Only set when count isn't 0.
  uint64 first_event_id = 3;
  // error_code is a gRPC status code (google.golang.org/grpc/codes);
  // 0 (OK) means the records are stored on disk. ALREADY_EXISTS means every
  // one was stored by an earlier attempt. FAILED_PRECONDITION means an
  // earlier sequence is missing: resend from the first request not yet acked.
  int32 error_code = 4;
  string error_message = 5;
  // count is how many records were added. It's lower than the request's if
  // some of them were stored by an earlier attempt.
  uint32 count = 6;
}

message SubscribeRequest {
  string topic = 1;
  int32 shard = 2;
  // start_id is the first event_id to send. Ignored when latest is true, or
  // when group has a stored offset for this shard.
  uint64 start_id = 3;
  // latest starts at the end of the shard: only new records are sent.
  bool latest = 4;
  // max_bytes caps the payload bytes in one EventBatch (0 = broker default).
  // A batch always holds at least one record.
  uint32 max_bytes = 5;
  // group, if set, starts at the group's stored offset. If it has none, the
  // start position above becomes its stored offset.
  string group = 6;
  // stop_at_end closes the stream, without an error, after the last record
  // stored when the call started, instead of waiting for new ones. Every
  // record acked before the call is included.
  bool stop_at_end = 7;
}

message Event {
  uint64 event_id = 1;
  bytes payload = 2;
  // timestamp is when the broker stored the record, in Unix milliseconds.
  int64 timestamp = 3;
}

message EventBatch {
  string topic = 1;
  int32 shard = 2;
  repeated Event events = 3;
}

message JoinRequest {
  string topic = 1;
  // consumer_id must be unique in the group.
  string consumer_id = 2;
  // group is who shares the shards. Empty means "default". Each group reads
  // the whole topic.
  string group = 3;
}

message Assignment {
  string topic = 1;
  // generation increases with each rebalance of the group.
  uint64 generation = 2;
  // shards this consumer should read now.
  repeated int32 shards = 3;
}

message CommitRequest {
  string topic = 1;
  // group is the group of the Join. Empty means "default".
  string group = 2;
  string consumer_id = 3;
  // generation is that of the consumer's latest Assignment.
  uint64 generation = 4;
  int32 shard = 5;
  // next_id is the first event_id not yet processed.
  uint64 next_id = 6;
}

message CommitResponse {}
